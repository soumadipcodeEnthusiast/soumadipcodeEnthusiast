<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" width="900" height="360">
  <defs>
    <style>
      @keyframes hueShift {
        0%   { filter: hue-rotate(0deg)   brightness(1.1); }
        100% { filter: hue-rotate(360deg) brightness(1.1); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.75; }
        50%       { opacity: 1; }
      }
      .pf { animation: hueShift 9s linear infinite; }
      .ol { animation: pulse 3s ease-in-out infinite; }
    </style>

    <!-- Subtle dot texture (light-mode: slightly warm dark) -->
    <pattern id="dt" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1E1E2E" opacity="0.45"/>
    </pattern>

    <!-- Pokémon-inspired rainbow gradient -->
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0.3" gradientUnits="objectBoundingBox">
      <stop offset="0%"    stop-color="#FFD700"/>
      <stop offset="14%"   stop-color="#FF4500"/>
      <stop offset="28%"   stop-color="#DA70D6"/>
      <stop offset="42%"   stop-color="#00BFFF"/>
      <stop offset="56%"   stop-color="#32CD32"/>
      <stop offset="70%"   stop-color="#FF69B4"/>
      <stop offset="84%"   stop-color="#FF8C00"/>
      <stop offset="100%"  stop-color="#FFD700"/>
    </linearGradient>

    <!-- Letter clip path -->
    <clipPath id="lc">
      <text x="450" y="246"
        text-anchor="middle"
        font-family="Impact,'Arial Narrow','Arial Black',Arial,sans-serif"
        font-size="175" font-weight="900"
        textLength="834" lengthAdjust="spacingAndGlyphs">SOUMADIP</text>
    </clipPath>
  </defs>

  <!-- Base background — slightly less dark for light-mode viewers -->
  <rect width="900" height="360" fill="#0C0F1E"/>

  <!-- Dot texture -->
  <rect width="900" height="360" fill="url(#dt)"/>

  <!-- Manga diagonal slabs — slightly more subtle for light-mode context -->
  <polygon points="0,0 900,0 900,54 0,108" fill="#10142A" opacity="0.65"/>
  <polygon points="0,252 900,198 900,360 0,360" fill="#10142A" opacity="0.65"/>

  <!-- Speed lines radiating from center -->
  <g stroke="#C8D4F8" stroke-width="0.7" opacity="0.04">
    <line x1="450" y1="180" x2="900" y2="180"/>
    <line x1="450" y1="180" x2="885" y2="360"/>
    <line x1="450" y1="180" x2="630" y2="360"/>
    <line x1="450" y1="180" x2="498" y2="360"/>
    <line x1="450" y1="180" x2="450" y2="360"/>
    <line x1="450" y1="180" x2="402" y2="360"/>
    <line x1="450" y1="180" x2="270" y2="360"/>
    <line x1="450" y1="180" x2="15"  y2="360"/>
    <line x1="450" y1="180" x2="0"   y2="180"/>
    <line x1="450" y1="180" x2="15"  y2="0"/>
    <line x1="450" y1="180" x2="270" y2="0"/>
    <line x1="450" y1="180" x2="402" y2="0"/>
    <line x1="450" y1="180" x2="450" y2="0"/>
    <line x1="450" y1="180" x2="498" y2="0"/>
    <line x1="450" y1="180" x2="630" y2="0"/>
    <line x1="450" y1="180" x2="885" y2="0"/>
  </g>

  <!-- Dense inner speed lines -->
  <g stroke="#C8D4F8" stroke-width="0.4" opacity="0.02">
    <line x1="450" y1="180" x2="900" y2="90"/>
    <line x1="450" y1="180" x2="900" y2="270"/>
    <line x1="450" y1="180" x2="757" y2="360"/>
    <line x1="450" y1="180" x2="564" y2="360"/>
    <line x1="450" y1="180" x2="336" y2="360"/>
    <line x1="450" y1="180" x2="143" y2="360"/>
    <line x1="450" y1="180" x2="0"   y2="270"/>
    <line x1="450" y1="180" x2="0"   y2="90"/>
    <line x1="450" y1="180" x2="143" y2="0"/>
    <line x1="450" y1="180" x2="336" y2="0"/>
    <line x1="450" y1="180" x2="564" y2="0"/>
    <line x1="450" y1="180" x2="757" y2="0"/>
  </g>

  <!-- Pokémon rainbow fill clipped to letter shapes -->
  <rect x="0" y="0" width="900" height="360"
    fill="url(#pg)" clip-path="url(#lc)" class="pf"/>

  <!-- Letter outline -->
  <text x="450" y="246"
    text-anchor="middle"
    font-family="Impact,'Arial Narrow','Arial Black',Arial,sans-serif"
    font-size="175" font-weight="900"
    textLength="834" lengthAdjust="spacingAndGlyphs"
    fill="none" stroke="#FFFFFF" stroke-width="1.5"
    class="ol">SOUMADIP</text>
</svg>
