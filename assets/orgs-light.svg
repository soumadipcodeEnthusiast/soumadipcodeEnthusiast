<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" width="900" height="200">
  <defs>
    <style>
      @keyframes fadeEdge {
        0%, 100% { opacity: 0.5; }
        50%       { opacity: 0.85; }
      }
      .edge { animation: fadeEdge 4s ease-in-out infinite; }
    </style>
    <pattern id="dp" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#F8FAFC"/>
  <rect width="900" height="200" fill="url(#dp)"/>

  <!-- Section label: CNCF -->
  <text x="24" y="22"
    font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace"
    font-size="9" fill="#2563EB" letter-spacing="1.8">CNCF · KUBERNETES ECOSYSTEM</text>

  <!-- CNCF cluster background -->
  <rect x="20" y="30" width="295" height="112" rx="4"
    fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>

  <!-- Org nodes Row 1 -->
  <rect x="28" y="40" width="118" height="24" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="87" y="56" text-anchor="middle"
    font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" fill="#1E293B">Kubeflow</text>

  <rect x="162" y="40" width="118" height="24" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="221" y="56" text-anchor="middle"
    font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" fill="#1E293B">Volcano / Kthena</text>

  <!-- Org nodes Row 2 -->
  <rect x="28" y="82" width="118" height="24" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="87" y="98" text-anchor="middle"
    font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" fill="#1E293B">KubeVirt</text>

  <rect x="162" y="82" width="118" height="24" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="221" y="98" text-anchor="middle"
    font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" fill="#1E293B">Argo CD</text>

  <!-- Port dots -->
  <circle cx="146" cy="52" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.5"/>
  <circle cx="280" cy="52" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.5"/>
  <circle cx="146" cy="94" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.5"/>
  <circle cx="280" cy="94" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- Bezier edges -->
  <path d="M 146,52 C 260,48 360,52 444,52"   stroke="#CBD5E1" stroke-width="1" fill="none" class="edge"/>
  <path d="M 280,52 C 350,52 388,68 444,68"   stroke="#CBD5E1" stroke-width="1" fill="none" class="edge"/>
  <path d="M 146,94 C 260,90 360,92 444,92"   stroke="#CBD5E1" stroke-width="1" fill="none" class="edge"/>
  <path d="M 280,94 C 350,94 394,108 444,108" stroke="#CBD5E1" stroke-width="1" fill="none" class="edge"/>

  <!-- Endpoint dots -->
  <circle cx="444" cy="52"  r="2.5" fill="#2563EB"/>
  <circle cx="444" cy="68"  r="2.5" fill="#2563EB"/>
  <circle cx="444" cy="92"  r="2.5" fill="#2563EB"/>
  <circle cx="444" cy="108" r="2.5" fill="#2563EB"/>

  <!-- Repo labels -->
  <text x="452" y="56"  font-family="'IBM Plex Mono',monospace" font-size="10" fill="#2563EB">kubeflow/notebooks</text>
  <text x="452" y="72"  font-family="'IBM Plex Mono',monospace" font-size="10" fill="#2563EB">volcano-sh/kthena</text>
  <text x="452" y="96"  font-family="'IBM Plex Mono',monospace" font-size="10" fill="#2563EB">kubevirt/kubevirt</text>
  <text x="452" y="112" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#2563EB">argoproj/argo-cd</text>

  <!-- Domain labels -->
  <text x="588" y="56"  font-family="'IBM Plex Mono',monospace" font-size="10" fill="#64748B">notebook infrastructure</text>
  <text x="588" y="72"  font-family="'IBM Plex Mono',monospace" font-size="10" fill="#64748B">AI inference routing</text>
  <text x="588" y="96"  font-family="'IBM Plex Mono',monospace" font-size="10" fill="#64748B">Kubernetes CI infra</text>
  <text x="588" y="112" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#64748B">GitOps interfaces</text>

  <!-- Transit separator -->
  <line x1="20" y1="152" x2="880" y2="152" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="164"
    font-family="'IBM Plex Mono',monospace"
    font-size="9" fill="#059669" letter-spacing="1.8">TRANSIT INFRASTRUCTURE</text>

  <!-- Transit org node -->
  <rect x="20" y="171" width="118" height="24" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8"/>
  <text x="79" y="187" text-anchor="middle"
    font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" fill="#1E293B">OneBusAway</text>

  <!-- Transit edge -->
  <circle cx="138" cy="183" r="2.5" fill="#059669" stroke="#FFFFFF" stroke-width="0.5"/>
  <line x1="138" y1="183" x2="444" y2="183" stroke="#CBD5E1" stroke-width="1" class="edge"/>
  <circle cx="444" cy="183" r="2.5" fill="#059669"/>

  <!-- Transit repo + domain -->
  <text x="452" y="187" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#059669">OneBusAway/watchdog</text>
  <text x="588" y="187" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#64748B">transit telemetry</text>
</svg>
